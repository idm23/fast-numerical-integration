# A minimal downstream package that cimports fast-numerical-integration's C API.
# Built in the release workflow against the freshly built wheel, to prove the
# shipped .pxd files support exactly what auto-optimal-control will do.
[build-system]
requires = ["setuptools>=77", "cython>=3.0", "fast-numerical-integration"]
build-backend = "setuptools.build_meta"

[project]
name = "downstream-kernels"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["fast-numerical-integration"]

[tool.setuptools]
packages = ["downstream_kernels"]
