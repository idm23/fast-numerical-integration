[build-system]
requires = ["setuptools>=68", "cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-numerical-integration"
version = "0.1.0"
description = "A framework for fast numerical integration in Python"
requires-python = ">=3.11"
dependencies = [
    "cython>=3.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[project.scripts]
fni = "fast_numerical_integration.main:main"
fni-bench = "fast_numerical_integration.benchmark:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]


[tool.uv]
# Rebuild the Cython extensions whenever their sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/**/*.pyx" },
    { file = "src/**/*.pxd" },
]
